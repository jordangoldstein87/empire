<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Arimo:ital,wght@0,400;0,700;1,700&family=Jost:wght@400;500;600&display=swap">
<style>
/* Empire: two storefronts (Empire Glassworks, Empire Smokes), one cart, one wholesale portal and the back office behind them.
   The pitch rail on the left moves between them; every class is prefixed by the part it belongs to. */
:root {
  --ink: #1d1a17; --ink-2: #5f5850; --line: #e3dcd2; --paper: #fbf7f1;
  --ember: #c35121; --ember-2: #d2815f; --navy: #111111; --navy-2: #1f1e1d; --navy-3: #34312f; --soft: #b9b2ab; --gold: #d2815f;
  --glass-bg: #f7f5f4; --glass-ink: #111111; --glass-acc: #c35121; --glass-blue: #748cab;
  --sm-bg: #faf6f6; --sm-ink: #202223; --sm-pink: #ffbb31; --sm-blue: #faf6f6; --sm-acc: #202223;
  --sans: "Jost", "Helvetica Neue", Arial, sans-serif; --bold: "Arimo", "Helvetica Neue", Arial, sans-serif; --serif: "Arimo", "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box }
html { scroll-behavior: smooth; overflow-x: clip }
body { margin: 0; background: var(--paper); color: var(--ink); font: 400 17px/1.55 var(--sans); -webkit-font-smoothing: antialiased; overflow-x: clip }
h1, h2, h3, h4 { margin: 0; line-height: 1.05; text-wrap: balance }
p { margin: 0 }
img { display: block; max-width: 100% }
button { font: inherit; color: inherit }
a { color: inherit }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0) }

/* the pitch rail */
#rail { position: fixed; z-index: 50; inset: 0 auto 0 0; width: 228px; background: var(--navy); color: #e9edf5; display: flex; flex-direction: column; gap: 6px; padding: 22px 14px; transition: width .3s ease }
#rail .rail-brand { display: flex; align-items: center; gap: 10px; padding: 0 8px 16px; border-bottom: 1px solid var(--navy-3); margin-bottom: 8px }
#rail .rail-brand img { width: 38px; height: 38px; border-radius: 50%; background: #fff }
#rail .rail-brand b { font: 800 19px/1 var(--bold); letter-spacing: .02em } #rail .rail-brand span { display: block; font-size: 12px; color: var(--soft); margin-top: 3px }
#rail a { display: flex; align-items: center; gap: 12px; padding: 11px 12px; border-radius: 11px; text-decoration: none; font-size: 15.5px; color: #cfd6e4; white-space: nowrap }
#rail a svg { flex: none; width: 19px; height: 19px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round }
#rail a:hover { background: var(--navy-2) } #rail a[aria-current="page"] { background: var(--navy-3); color: #fff }
#rail a i { margin-left: auto; font-style: normal; font-size: 12px; background: var(--ember); color: #fff; border-radius: 10px; padding: 1px 7px }
#rail .rail-k { font-size: 11.5px; letter-spacing: .16em; text-transform: uppercase; color: #7f8aa0; padding: 14px 12px 4px }
#rail .rail-foot { margin-top: auto; font-size: 12.5px; color: #7f8aa0; padding: 0 10px; line-height: 1.45 }
#rail .rail-pitch { display: flex; align-items: center; gap: 8px; color: var(--gold); text-decoration: none; font-weight: 600; margin-bottom: 6px }
#main { margin-left: 228px; min-height: 100vh; transition: margin .3s ease }
body.rail-min #rail { width: 68px } body.rail-min #rail .rail-brand div, body.rail-min #rail a span, body.rail-min #rail .rail-k, body.rail-min #rail .rail-foot, body.rail-min #rail a i { display: none }
body.rail-min #main { margin-left: 68px }
#mtop { display: none }
.badge-pv { position: fixed; z-index: 60; right: 16px; bottom: 16px; background: var(--navy); color: #fff; font-size: 13px; border-radius: 20px; padding: 7px 14px; box-shadow: 0 8px 24px rgba(0,0,0,.2) }
body.cap .badge-pv { display: none }

/* welcome: the opening video and the one-backend story */
.wl-hero { position: relative; min-height: 100svh; background: #0f0c0a; color: #fff; overflow: hidden; display: grid }
.wl-hero > .wl-bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: .55; transform: scale(1.08); transition: transform 16s ease-out, opacity 1s }
.wl-hero.playing > .wl-bg { transform: scale(1) }
.wl-hero::after { content: ""; position: absolute; inset: 0; background: radial-gradient(ellipse at center, rgba(0,0,0,.1), rgba(0,0,0,.6) 80%); pointer-events: none }
.wl-front { position: relative; z-index: 2; align-self: center; justify-self: center; text-align: center; display: grid; gap: 22px; justify-items: center; padding: 40px 20px; transition: opacity .6s }
.wl-mark { display: flex; align-items: center; gap: 16px }
.wl-mark img { width: 84px; height: 84px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 6px rgba(255,255,255,.12) }
.wl-front h1 { font: 800 clamp(48px, 7.5vw, 112px)/.95 var(--bold); letter-spacing: -.02em; max-width: 12ch }
.wl-front p { font-size: clamp(19px, 1.9vw, 25px); color: #f3e7dc; max-width: 30ch }
.wl-play { display: inline-flex; align-items: center; gap: 14px; border: 0; background: #fff; color: var(--ink); border-radius: 40px; padding: 14px 26px 14px 16px; font-weight: 700; font-size: 18px; cursor: pointer; box-shadow: 0 14px 40px rgba(0,0,0,.35) }
.wl-play i { width: 40px; height: 40px; border-radius: 50%; background: var(--ember); display: grid; place-items: center }
.wl-play i::before { content: ""; border-left: 13px solid #fff; border-top: 8px solid transparent; border-bottom: 8px solid transparent; margin-left: 4px }
.wl-hero.playing .wl-front { opacity: 0; pointer-events: none }
.wl-stage { position: absolute; inset: 0; z-index: 3; pointer-events: none }
.wl-sc { position: absolute; inset: 0; display: grid; place-items: center; opacity: 0; transition: opacity .9s ease; padding: 6vh 6vw }
.wl-sc.on { opacity: 1 }
.wl-sc .kb { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; animation: kb 7s ease-out both; opacity: .5 }
@keyframes kb { from { transform: scale(1.1) } to { transform: scale(1) } }
.wl-line { position: relative; font: 800 clamp(40px, 6vw, 92px)/1 var(--bold); text-align: center; max-width: 14ch; text-shadow: 0 4px 30px rgba(0,0,0,.5); animation: up .9s ease both }
.wl-line small { display: block; font: 600 clamp(14px, 1.3vw, 18px) var(--sans); letter-spacing: .2em; text-transform: uppercase; color: var(--gold); margin-bottom: 18px }
@keyframes up { from { opacity: 0; transform: translateY(26px) } }
.wl-two { position: relative; display: flex; gap: clamp(30px, 7vw, 120px); align-items: center; justify-content: center; flex-wrap: wrap }
.wl-two > div { display: grid; gap: 14px; justify-items: center; animation: up .9s ease both; animation-delay: var(--d) }
.wl-two .lg-g { width: clamp(120px, 14vw, 200px); border-radius: 50%; background: #fff }
.wl-two .lg-s { width: clamp(260px, 30vw, 460px); filter: invert(1) }
.wl-two span { font-size: 16px; color: #f3e7dc }
.wl-web { position: relative; display: grid; gap: 18px; justify-items: center; width: min(1000px, 100%, calc((100svh - 210px) * 1.7)) }
.wl-web .cap { font: 800 clamp(30px, 3.6vw, 54px)/1.05 var(--bold); text-align: center; text-shadow: 0 4px 24px rgba(0,0,0,.5) }
.wl-web .cap small { display: block; font: 600 15px var(--sans); letter-spacing: .2em; text-transform: uppercase; color: var(--gold); margin-bottom: 10px }
.wl-win { width: 100%; border-radius: 14px; overflow: hidden; background: #fff; box-shadow: 0 40px 100px rgba(0,0,0,.6); animation: up 1s ease both .2s }
.wl-win .bar { display: flex; gap: 7px; align-items: center; padding: 10px 14px; background: #ece7e0; color: #6b645c; font-size: 13px }
.wl-win .bar i { width: 11px; height: 11px; border-radius: 50%; background: #d5cdc2 } .wl-win .bar span { margin-left: 10px; background: #fff; border-radius: 6px; padding: 3px 12px }
.wl-win img { width: 100%; aspect-ratio: 16 / 9.4; object-fit: cover; object-position: top }
.wl-ring { position: relative; width: min(560px, 100%, calc(100svh - 230px)); aspect-ratio: 1; display: grid; place-items: center; margin-bottom: 70px }
.wl-ring .core { width: 46%; aspect-ratio: 1; border-radius: 50%; background: var(--navy); border: 2px solid var(--gold); display: grid; place-items: center; text-align: center; box-shadow: 0 0 80px rgba(240,180,90,.35); animation: up .8s ease both }
.wl-ring .core b { font: 800 clamp(26px, 3.4vw, 44px)/1 var(--bold) } .wl-ring .core span { font-size: 13px; letter-spacing: .18em; text-transform: uppercase; color: var(--gold) }
.wl-ring .orb { position: absolute; width: 23%; aspect-ratio: 1; border-radius: 50%; background: #fff; color: var(--ink); display: grid; place-items: center; text-align: center; font: 700 clamp(11px, 1.2vw, 15px)/1.15 var(--sans); padding: 8px; transform: translate(-50%, -50%); animation: pop .6s ease both; animation-delay: var(--d); box-shadow: 0 10px 30px rgba(0,0,0,.4) }
.wl-ring .orb img { width: 70% } .wl-ring .orb.dk { background: var(--navy-3); color: #fff }
@keyframes pop { from { opacity: 0; transform: translate(-50%, -50%) scale(.6) } }
.wl-ring .core > div { display: grid; gap: 6px; justify-items: center }
.wl-ring .core-mark { width: 34%; border-radius: 50%; background: #fff }
.wl-ringcap { position: absolute; left: 0; right: 0; bottom: 5vh; text-align: center; font: 800 clamp(26px, 3vw, 44px)/1.1 var(--bold); text-shadow: 0 4px 24px rgba(0,0,0,.6); animation: up .9s ease both 1.4s; padding: 0 16px }
.wl-ringcap small { display: block; font: 600 14px var(--sans); letter-spacing: .2em; text-transform: uppercase; color: var(--gold); margin-bottom: 8px }
.wl-web.dk .wl-win .bar { background: #1f1e1d; color: #b9b2ab } .wl-web.dk .wl-win .bar span { background: #111 } .wl-web.dk .wl-win .bar i { background: #34312f }
.wl-one { background: #111 } .wl-one .wl-trio a { background: #1f1e1d; border-color: #34312f } .wl-one .wl-trio a:hover { background: #2a2827 }
.wl-bar { position: absolute; z-index: 4; left: 0; bottom: 0; height: 3px; background: var(--gold); width: 0 }
.wl-skip { position: absolute; z-index: 5; right: 18px; top: 18px; background: rgba(0,0,0,.4); border: 1px solid rgba(255,255,255,.3); color: #fff; border-radius: 20px; padding: 7px 14px; font-size: 14px; cursor: pointer; display: none }
.wl-hero.playing .wl-skip { display: block }
.wl-more { position: absolute; z-index: 4; left: 50%; bottom: 26px; transform: translateX(-50%); color: #fff; font-size: 15px; text-decoration: none; display: grid; justify-items: center; gap: 4px; opacity: .85 }
.wl-more svg { width: 22px; stroke: #fff; fill: none; stroke-width: 1.8; animation: bob 2s ease-in-out infinite }
@keyframes bob { 50% { transform: translateY(5px) } }
.wl-hero.playing .wl-more { display: none }

.wl-sec { padding: clamp(70px, 11vh, 130px) clamp(20px, 5vw, 64px); max-width: 1240px; margin: 0 auto }
.wl-k { font: 700 13px var(--sans); letter-spacing: .2em; text-transform: uppercase; color: var(--ember) }
.wl-h { font: 800 clamp(40px, 5.4vw, 76px)/1 var(--bold); letter-spacing: -.02em; margin: 12px 0 16px; max-width: 16ch }
.wl-p { font-size: clamp(18px, 1.6vw, 21px); color: var(--ink-2); max-width: 44ch }
.wl-brands { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; margin-top: 44px }
.wl-card { display: grid; text-decoration: none; border-radius: 22px; overflow: hidden; border: 1px solid var(--line); background: #fff; transition: transform .25s, box-shadow .25s }
.wl-card:hover { transform: translateY(-4px); box-shadow: 0 24px 50px rgba(0,0,0,.1) }
.wl-card img.shot { width: 100%; aspect-ratio: 16 / 10; object-fit: cover; object-position: top; border-bottom: 1px solid var(--line) }
.wl-card .t { padding: 20px 22px 24px; display: grid; gap: 6px }
.wl-card b { font: 800 30px/1 var(--bold) } .wl-card span { color: var(--ink-2) } .wl-card u { text-decoration: none; color: var(--ember); font-weight: 700 }
.wl-one { background: var(--navy); color: #fff }
.wl-one .wl-k { color: var(--gold) } .wl-one .wl-p { color: #c5cede }
.wl-trio { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; margin-top: 44px }
.wl-trio a { text-decoration: none; background: var(--navy-2); border-radius: 18px; padding: 26px 24px; display: grid; gap: 10px; align-content: start; border: 1px solid var(--navy-3); transition: background .2s }
.wl-trio a:hover { background: var(--navy-3) }
.wl-trio svg { width: 30px; height: 30px; stroke: var(--gold); fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round }
.wl-trio b { font: 800 28px/1.05 var(--bold) } .wl-trio span { color: #c5cede; font-size: 16px } .wl-trio u { text-decoration: none; color: var(--gold); font-weight: 700; font-size: 15px }
.wl-cta { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 34px }
.wl-cta a { text-decoration: none; border-radius: 30px; padding: 14px 24px; font-weight: 700; background: var(--gold); color: var(--navy) }
.wl-cta a.o { background: transparent; color: #fff; border: 1px solid #56627a }

/* storefronts: shared pieces */
.st { min-height: 100vh }
.st-ann { text-align: center; font-size: 14px; padding: 8px 16px }
.st-head { position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 22px; padding: 14px clamp(16px, 4vw, 48px); backdrop-filter: blur(12px) }
.st-head .logo { display: flex; align-items: center; gap: 12px; text-decoration: none; cursor: pointer; background: none; border: 0; padding: 0 }
.st-nav { display: flex; gap: 22px; margin-left: auto; align-items: center }
.st-nav button { background: none; border: 0; cursor: pointer; font-size: 16px; padding: 6px 2px }
.st-nav button:hover { text-decoration: underline; text-underline-offset: 5px }
.st-cart { position: relative; display: grid; place-items: center; width: 44px; height: 44px; border-radius: 50%; border: 0; cursor: pointer }
.st-cart svg { width: 21px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round }
.st-cart i { position: absolute; top: -2px; right: -2px; min-width: 20px; height: 20px; border-radius: 10px; font: 700 12px/20px var(--sans); font-style: normal; text-align: center; padding: 0 5px }
.st-hero { position: relative; display: grid; grid-template-columns: 1.05fr 1fr; align-items: center; gap: clamp(24px, 4vw, 60px); padding: clamp(30px, 5vw, 60px) clamp(16px, 4vw, 48px) clamp(50px, 7vw, 90px) }
.st-hero h1 { letter-spacing: -.02em }
.st-hero .lede { font-size: clamp(18px, 1.7vw, 22px); margin-top: 18px; max-width: 34ch }
.st-hero .btns { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 28px }
.st-btn { border: 0; cursor: pointer; border-radius: 40px; padding: 15px 26px; font-weight: 700; font-size: 16px; text-decoration: none; display: inline-block }
.st-btn.o { background: transparent; border: 2px solid currentColor; padding: 13px 24px }
.st-hero .art { position: relative; aspect-ratio: 4 / 3.4; border-radius: 28px; overflow: hidden }

.st-sec { padding: clamp(50px, 8vw, 100px) clamp(16px, 4vw, 48px) }

.st-chips { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 26px }
.st-chips button { border-radius: 30px; padding: 9px 18px; cursor: pointer; font-size: 15px; font-weight: 500 }
.st-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: clamp(12px, 1.6vw, 22px) }
.st-card { display: grid; gap: 10px; text-align: left; background: none; border: 0; padding: 0; cursor: pointer }
.st-card .ph { position: relative; aspect-ratio: 1; border-radius: 18px; overflow: hidden; background: #fff }
.st-card .ph img { width: 100%; height: 100%; object-fit: cover; transition: transform .5s }
.st-card:hover .ph img { transform: scale(1.05) }
.st-card .tg { position: absolute; left: 10px; top: 10px; font-size: 12px; font-weight: 700; border-radius: 20px; padding: 4px 10px; background: rgba(255,255,255,.92); color: #222 }
.st-card .nm { font-weight: 600; font-size: 16px; line-height: 1.3 }
.st-card .pr { font-size: 15.5px; opacity: .8 }
.st-band { display: grid; grid-template-columns: 1fr 1fr; gap: clamp(24px, 4vw, 60px); align-items: center }
.st-band img { border-radius: 24px; width: 100%; aspect-ratio: 4 / 3; object-fit: cover }

.st-glass .marq div { display: inline-block; animation: marq 40s linear infinite } .st-glass .marq span { margin: 0 22px }
@keyframes marq { to { transform: translateX(-50%) } }

/* Empire Smokes: the glass boutique, soft pink and sky, serif italics */
.st-smokes { background: var(--sm-bg); color: var(--sm-ink) }
.st-smokes .st-ann { background: #202223; color: #fff; font-weight: 500 }
.st-smokes .st-head { background: rgba(250,246,246,.92); border-bottom: 1px solid #ece6e6 }
.st-smokes .st-head .logo img { height: 46px; width: auto }

.st-smokes .st-hero h1 { font-size: clamp(50px, 6.6vw, 100px); line-height: .98 }
